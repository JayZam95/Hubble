# Build Performance Optimizations for Gradle and Kotlin
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# Android & Jetpack Configurations
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.suppressManifestPackageWarning=true

# Flutter template flags
android.newDsl=false
android.builtInKotlin=false
